author "VeoLink Community"
description "start and stop VeoLink Server for Ubuntu (upstart)"
version "1.0"

start on started networking
stop on runlevel [!2345]

env APPUSER="user"
env APPDIR="/home/user/work/veolink/VeoLink-CE-Ubuntu-xxx/bin"

env LD_LIBRARY_PATH=$APPDIR/../lib/:$LD_LIBRARY_PATH

env APPBIN="VeoLinkServer"
env APPARGS="-platform offscreen "

respawn

script
  exec su - $APPUSER -c "$APPDIR/$APPBIN $APPARGS"
end script
